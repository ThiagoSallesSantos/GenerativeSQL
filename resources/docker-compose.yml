services:

  northwind_postgres:
    container_name: northwind_postgres
    image: postgres:latest
    env_file:
      - ".env"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./postgre_northwind.sql:/docker-entrypoint-initdb.d/postgre_northwind.sql
      - VolumeExamplePostgreNorthwind:/var/lib/postgresql/data
    ports:
      - ${POSTGRES_PORT}:5432

volumes:
  VolumeExamplePostgreNorthwind:
